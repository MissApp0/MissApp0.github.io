name: MissApp Compatibility Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Validate source and hosted app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify source and Firebase Hosting copies match
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source_file; do
            hosted_file="public/$source_file"
            if [[ ! -f "$hosted_file" ]]; then
              echo "::error::Missing Firebase Hosting copy: $hosted_file"
              exit 1
            fi
            if ! cmp -s "$source_file" "$hosted_file"; then
              echo "::error::Source and hosted copy differ: $source_file vs $hosted_file"
              diff -u "$source_file" "$hosted_file" || true
              exit 1
            fi
          done < <(find css js -type f \( -name '*.css' -o -name '*.js' \) -print0)

          # index.html intentionally differs: root is the modular app; public/index.html preserves the legacy single-file app.
          for source_file in manifest.webmanifest icon.svg firebase-messaging-sw.js; do
            if [[ ! -f "public/$source_file" ]]; then
              echo "::error::Missing Firebase Hosting copy: public/$source_file"
              exit 1
            fi
            if ! cmp -s "$source_file" "public/$source_file"; then
              echo "::error::Source and hosted copy differ: $source_file"
              diff -u "$source_file" "public/$source_file" || true
              exit 1
            fi
          done
          echo "Source and Firebase Hosting copies are synchronized."

      - name: Check JavaScript module syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find js -type f -name '*.js' -print0)

      - name: Verify local module imports and HTML asset paths
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const failures = [];
          const jsFiles = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && full.endsWith('.js')) jsFiles.push(full);
            }
          }
          walk('js');

          for (const file of jsFiles) {
            const source = fs.readFileSync(file, 'utf8');
            const imports = source.matchAll(/(?:from\s*|import\s*)['"]((?:\.\.\/|\.\/)[^'"]+)['"]/g);
            for (const match of imports) {
              const specifier = match[1];
              const target = path.resolve(path.dirname(file), specifier);
              if (!fs.existsSync(target)) failures.push(file + ': missing local import ' + specifier);
            }
          }

          for (const htmlFile of ['index.html', 'public/index.html']) {
            const html = fs.readFileSync(htmlFile, 'utf8');
            for (const match of html.matchAll(/(?:src|href)=["']([^"'#]+)["']/g)) {
              const asset = match[1];
              if (/^(?:https?:|data:|mailto:|tel:|javascript:)/i.test(asset)) continue;
              const target = path.resolve(path.dirname(htmlFile), asset.split('?')[0]);
              if (!fs.existsSync(target)) failures.push(htmlFile + ': missing asset ' + asset);
            }
          }

          if (failures.length) {
            for (const failure of failures) console.error('::error::' + failure);
            process.exit(1);
          }
          console.log('All local module imports and HTML asset paths exist.');
          NODE
