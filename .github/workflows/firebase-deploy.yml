name: Deploy Firebase Firestore Rules

on:
  push:
    branches:
      - main
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/firebase-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-firestore-rules
  cancel-in-progress: true

jobs:
  deploy-firestore-rules:
    name: Deploy Firestore rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Deploy Firestore rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          test -n "$FIREBASE_TOKEN" || {
            echo "FIREBASE_TOKEN GitHub secret is not configured."
            exit 1
          }
          firebase deploy --only firestore:rules --project missapp-c099e --token "$FIREBASE_TOKEN" --non-interactive
